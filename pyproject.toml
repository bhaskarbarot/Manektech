[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-store"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["application"]

[tool.pytest.ini_options]
testpaths = ["application/ontology_store/tests"]
